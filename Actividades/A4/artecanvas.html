<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Arte en Canvas</title>
  <style>
    body {
        display: flex;
        justify-content: center;
    }
      canvas{
          border: 3px solid rgb(145,234,90);
          background-color: rgb(130,231,254);
      }
  </style>

  </head>

  <script>
      window.onload=function(){
          var canvas = document.getElementById("micanvas");
          var context = canvas.getContext("2d");

          var y = 0;
          var dy = 0.3; //velocodad de anim.

          function draw() {
                //busbujas
                context.fillStyle= "rgba(255, 255, 255, 0.6)"; //un px blanco
                context.fillRect(100,120 + y,30,30);
                context.fillRect(180,140 + y,60,60);
                context.fillRect(160,180 + y,40,40);
                context.fillRect(220,250 + y,20,20);

                //ojo
                context.fillStyle= "rgb(0, 0, 0)"; //un px naranja
                context.fillRect(340,270 + y,30,30);

                //parpado
                //context.fillStyle= "rgb(200, 67, 15)"; //un px naranja
                //context.fillRect(340,250 + y,30,30);

                //Naranja claro
                context.fillStyle= "rgb(252, 205, 129)";
                context.fillRect(400 ,300 + y,30,30);
                context.fillStyle= "rgb(252, 205, 129)";
                context.fillRect(370,300 + y,150,60);
                context.fillStyle= "rgb(252, 205, 129)";
                context.fillRect(400,300 + y,90,90);

                context.fillStyle= "rgb(251, 135, 4)";
                context.fillRect(430,300 + y,90,30);
                context.fillStyle= "rgb(251, 135, 4)"; //un px naranja
                context.fillRect(370,300 + y,30,30);
                context.fillStyle= "rgb(251, 135, 4)";
                context.fillRect(310,330 + y,60,30);
                context.fillStyle= "rgb(251, 135, 4)"; //aleta 1
                context.fillRect(370,360 + y,30,30);
                context.fillStyle= "rgb(251, 135, 4)"; 
                context.fillRect(370,390 + y,60,30);
                context.fillStyle= "rgb(251, 135, 4)"; 
                context.fillRect(400,420 + y,30,30);
                context.fillStyle= "rgb(251, 135, 4)"; //aleta 2
                context.fillRect(460,390 + y,30,30);
                context.fillStyle= "rgb(251, 135, 4)"; 
                context.fillRect(370,270 + y,90,30);
                
                //naranja oscuro
                context.fillStyle= "rgb(200, 67, 15)"; //un px naranja oscuro
                context.fillRect(520,300 + y,30,30);
                context.fillStyle= "rgb(200, 67, 15)"; 
                context.fillRect(460,270 + y,90,30);
                context.fillStyle= "rgb(200, 67, 15)"; 
                context.fillRect(280,300 + y,90,30); //cabeza
                context.fillStyle= "rgb(200, 67, 15)";
                context.fillRect(280,270 + y,60,30);
                context.fillStyle= "rgb(200, 67, 15)";
                context.fillRect(310,240 + y,210,30);
                context.fillStyle= "rgb(200, 67, 15)";
                context.fillRect(340,210 + y,120,30);

                //aleta superior
                context.fillStyle= "rgb(251, 135, 4)";
                context.fillRect(460,210 + y,60,30);
                context.fillStyle= "rgb(251, 135, 4)";
                context.fillRect(400,180 + y,120,30);
                context.fillStyle= "rgb(251, 135, 4)";
                context.fillRect(430,150 + y,60,30);

                //cola y anim.
                context.fillStyle= "rgb(251, 135, 4)";
                context.fillRect(550,240 + y ,30,120);
                
                context.fillRect(580,210 + y,30,180);
                
                context.fillRect(610,180 + y,30,90);
                
                context.fillRect(610,300 + y,30,120);
                
                context.fillRect(640,390 + y,30,30);
                
                context.fillRect(640,180 + y,30,30);
            }

            function animate(){
                requestAnimationFrame(animate);
                context.clearRect(0, 0, canvas.width, canvas.height);
                y += dy;
                if (y >= 10 || y < -10) {
                dy = -dy;
            }

            draw();
            console.log('animado');

        }
      animate();
    };
  </script>

<body>
   <canvas id="micanvas" width="800" height="600"></canvas>

<ol>
<regresar><a href="../../index.html" target="_blank">Regresar</a>
</ol>
  
</body>
</html>
